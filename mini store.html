<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store - Katalog Produk & Keranjang Belanja</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                    <i class="fa-solid fa-store text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">MiniStore</h1>
                    <p class="text-xs text-slate-400">Katalog Eksklusif & Belanja Online</p>
                </div>
            </div>

            <!-- Cart Trigger Button -->
            <div class="flex items-center gap-3">
                <button onclick="window.toggleCartModal && window.toggleCartModal()" class="relative bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-slate-200 px-4 py-2.5 rounded-2xl transition-all flex items-center gap-2.5 cursor-pointer shadow-md active:scale-95">
                    <i class="fa-solid fa-bag-shopping text-indigo-400"></i>
                    <span class="text-xs font-semibold hidden sm:inline">Keranjang</span>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-indigo-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Controls Bar: Search, Category Filter, Sort -->
        <section class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-4 sm:p-5 flex flex-col md:flex-row gap-4 items-center justify-between shadow-xl">
            <!-- Search Input -->
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                    <i class="fa-solid fa-search text-sm"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Cari nama produk..."
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl pl-10 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <!-- Category Filter Buttons -->
            <div id="categoryFilters" class="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 text-xs">
                <button data-cat="all" class="cat-btn px-4 py-2 rounded-xl font-semibold bg-indigo-600 text-white transition-all whitespace-nowrap cursor-pointer shadow-md shadow-indigo-600/20">Semua</button>
                <!-- Dynamically loaded categories -->
            </div>

            <!-- Price Sorting -->
            <div class="w-full md:w-auto flex items-center gap-2">
                <span class="text-xs text-slate-400 whitespace-nowrap"><i class="fa-solid fa-sort mr-1"></i>Urutkan:</span>
                <select id="sortSelect" class="w-full md:w-auto bg-slate-950/80 border border-slate-800 text-slate-300 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500 cursor-pointer">
                    <option value="default">Pilihan Terbaik</option>
                    <option value="low-high">Harga: Rendah ke Tinggi</option>
                    <option value="high-low">Harga: Tinggi ke Rendah</option>
                    <option value="rating">Rating Tertinggi</option>
                </select>
            </div>
        </section>

        <!-- Product Grid Container -->
        <section>
            <div id="loadingState" class="text-center py-24 space-y-3">
                <div class="inline-block w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm text-slate-400">Memuat katalog produk dari server...</p>
            </div>

            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamically populated via JS -->
            </div>
        </section>

    </main>

    <div id="cartModal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity" onclick="window.toggleCartModal && window.toggleCartModal()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-slate-900 border-l border-slate-800 p-6 flex flex-col justify-between shadow-2xl">
                <!-- Header -->
                <div>
                    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-cart-shopping text-indigo-400"></i>
                            <h2 class="font-bold text-lg text-slate-100">Keranjang Belanja</h2>
                        </div>
                        <button onclick="window.toggleCartModal && window.toggleCartModal()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all cursor-pointer">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Cart Items List -->
                    <div id="cartItemsContainer" class="mt-4 space-y-3 max-h-[calc(100vh-20rem)] overflow-y-auto pr-1">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <!-- Footer Checkout Summary -->
                <div class="pt-4 border-t border-slate-800 space-y-4">
                    <div class="space-y-1.5 text-sm">
                        <div class="flex justify-between text-slate-400">
                            <span>Total Item:</span>
                            <span id="cartTotalItems" class="font-semibold text-slate-200">0 pcs</span>
                        </div>
                        <div class="flex justify-between text-base font-bold text-slate-100">
                            <span>Total Harga:</span>
                            <span id="cartTotalPrice" class="text-indigo-400">$0.00</span>
                        </div>
                    </div>

                    <button id="checkoutBtn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-credit-card"></i> Checkout Sekarang
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast Message Box -->
    <div id="toastNotification" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 text-slate-100 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <div id="toastIcon" class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastMessage" class="text-xs font-semibold">Produk berhasil ditambahkan!</span>
    </div>

    <!-- Main JS Module -->
    <script type="module" src="app.js"></script>
</body>
</html>
